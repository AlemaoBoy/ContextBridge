name: CI

on:
  push:
    branches: [main, develop, release-validation/v0.1.0]
  pull_request:
    branches: [main, develop]

permissions: {}

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run Mypy type check
        run: python -m mypy src

      - name: Run Pytest with overall coverage gate (>= 95%)
        run: python -m pytest --cov=contextbridge --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=95

      - name: Check critical module coverage (>= 95%)
        run: python scripts/check_coverage_gates.py coverage.json

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata with Twine
        run: python -m twine check dist/*
