<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ContextBridge Banner — Your context. Any agent. No lock-in.">
  <defs>
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="accent-rev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="82%" cy="50%" r="36%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" rx="20" fill="url(#banner-bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#dot-grid)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow-cyan)" />
  <rect width="1200" height="320" rx="20" fill="url(#glow-indigo)" />
  <rect x="1.5" y="1.5" width="1197" height="317" rx="19" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Subtle background bridge curves spanning left to right -->
  <path d="M 40 245 C 240 165, 340 275, 520 225" fill="none" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2" />
  <path d="M 680 95 C 860 45, 960 155, 1160 75" fill="none" stroke="#818CF8" stroke-opacity="0.12" stroke-width="2" />

  <!-- Centered Emblem + Typography Lockup -->
  <g transform="translate(155, 76)">
    <!-- Brand Mark -->
    <g transform="translate(0, 14) scale(1.1)">
      <rect x="4" y="4" width="120" height="120" rx="30" fill="#0D1117" stroke="url(#accent-grad)" stroke-width="3" />
      <path d="M 32 54 C 44 28, 84 28, 96 54" fill="none" stroke="url(#accent-grad)" stroke-width="7.5" stroke-linecap="round" />
      <path d="M 96 74 C 84 100, 44 100, 32 74" fill="none" stroke="url(#accent-rev)" stroke-width="7.5" stroke-linecap="round" />
      <path d="M 36 64 C 52 50, 76 78, 92 64" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" opacity="0.92" />
      <circle cx="32" cy="64" r="11" fill="#0D1117" stroke="#38BDF8" stroke-width="5" />
      <circle cx="32" cy="64" r="3.5" fill="#38BDF8" />
      <circle cx="96" cy="64" r="11" fill="#0D1117" stroke="#818CF8" stroke-width="5" />
      <circle cx="96" cy="64" r="3.5" fill="#818CF8" />
    </g>

    <!-- Title & Slogan -->
    <text x="178" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.4" fill="#F8FAFC">
      Context<tspan fill="url(#accent-grad)">Bridge</tspan>
    </text>
    <text x="182" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0.2" fill="#CBD5E1">
      Your context. Any agent. No lock-in.
    </text>

    <!-- Subtle Feature Pills -->
    <g transform="translate(182, 146)">
      <rect x="0" y="0" width="142" height="28" rx="14" fill="#111827" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <text x="71" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#7DD3FC">100% Local CLI</text>

      <rect x="154" y="0" width="150" height="28" rx="14" fill="#111827" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1" />
      <text x="229" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#A5B4FC">Agent Skills Spec</text>

      <rect x="316" y="0" width="160" height="28" rx="14" fill="#111827" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <text x="396" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#E2E8F0">Zero Telemetry</text>

      <rect x="488" y="0" width="108" height="28" rx="14" fill="#111827" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1" />
      <text x="542" y="18.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#C7D2FE">v0.1.0 MIT</text>
    </g>
  </g>
</svg>
