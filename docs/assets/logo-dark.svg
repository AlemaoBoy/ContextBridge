<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 112" width="460" height="112" role="img" aria-label="ContextBridge Dark Logo">
  <defs>
    <linearGradient id="cb-dark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="cb-dark-grad-rev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <rect width="460" height="112" rx="16" fill="#0D1117" />
  <!-- Emblem -->
  <g transform="translate(20, 16) scale(0.625)">
    <rect x="6" y="6" width="116" height="116" rx="28" fill="#111827" stroke="url(#cb-dark-grad)" stroke-width="3.5" />
    <path d="M 32 54 C 44 28, 84 28, 96 54" fill="none" stroke="url(#cb-dark-grad)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 96 74 C 84 100, 44 100, 32 74" fill="none" stroke="url(#cb-dark-grad-rev)" stroke-width="7.5" stroke-linecap="round" />
    <path d="M 36 64 C 52 50, 76 78, 92 64" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <circle cx="32" cy="64" r="11" fill="#0D1117" stroke="#38BDF8" stroke-width="5" />
    <circle cx="32" cy="64" r="3.5" fill="#38BDF8" />
    <circle cx="96" cy="64" r="11" fill="#0D1117" stroke="#818CF8" stroke-width="5" />
    <circle cx="96" cy="64" r="3.5" fill="#818CF8" />
  </g>
  <!-- Wordmark -->
  <text x="118" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6" fill="#F8FAFC">
    Context<tspan fill="url(#cb-dark-grad)">Bridge</tspan>
  </text>
  <text x="120" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="0.2" fill="#94A3B8">
    Your context. Any agent. No lock-in.
  </text>
</svg>
